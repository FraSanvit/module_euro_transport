# Example configuration of this module.
# Countries to process, as ISO 3166-1 alpha-3 codes.
# Sources (one per country, metric and vehicle category):
#   vehicle-km:    EU27 JRC-IDEES 2021; GBR, NOR Eurostat; CHE BFS;
#                  MKD Eurostat (cars, buses) + MAKSTAT (heavy-duty).
#                  ALB, BIH, MNE, SRB, XKX, ISL: none (left missing).
#   vehicle stock: EU27 JRC-IDEES 2021; NOR, ALB, BIH, MNE, SRB Eurostat; CHE BFS;
#                  GBR DfT; MKD MAKSTAT; ISL Statistics Iceland; XKX ASK.
countries:
  [AUT, BEL, BGR, CYP, CZE, DEU, DNK, ESP, EST, FIN, FRA, GRC, HRV, HUN, IRL, ITA,
   LTU, LUX, LVA, MLT, NLD, POL, PRT, ROU, SVK, SVN, SWE, GBR, NOR, CHE, MKD,
   ALB, BIH, MNE, SRB, XKX, ISL]
# Heavy-duty vehicle-km (territorial): years, calibration year and method parameters.
heavy_duty:
  years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  reference_year: 2019
  parameters: {k: 1.0, f_net: 0.9}
  cabotage: {include: true, empty_share: host_national}
  international: {reporter_coverage_correction: true}
