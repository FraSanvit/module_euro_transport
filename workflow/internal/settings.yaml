# Module settings that users cannot modify.
resources:
  automatic:
    jrc_idees:
      # JRC-IDEES 2021, version 1 (2024-05-20). One zip per EU27 country.
      url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/JRC-IDEES/JRC-IDEES-2021_v1/JRC-IDEES-2021_{jrc_code}.zip"
      source: "JRC-IDEES-2021 v1"
      # ISO 3166-1 alpha-3 -> JRC-IDEES country code (Eurostat style, Greece = EL).
      country_codes:
        AUT: AT
        BEL: BE
        BGR: BG
        CYP: CY
        CZE: CZ
        DEU: DE
        DNK: DK
        EST: EE
        ESP: ES
        FIN: FI
        FRA: FR
        GRC: EL
        HRV: HR
        HUN: HU
        IRL: IE
        ITA: IT
        LTU: LT
        LUX: LU
        LVA: LV
        MLT: MT
        NLD: NL
        POL: PL
        PRT: PT
        ROU: RO
        SWE: SE
        SVN: SI
        SVK: SK
    eurostat:
      # Eurostat dissemination API, full dataset as SDMX-CSV. Not versioned:
      # the "LAST UPDATE" column of each download is logged.
      url: "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/{dataset}/?format=SDMX-CSV&compressed=false"
      datasets: [road_tf_vehmov, road_tf_road]
      source: "Eurostat road_tf_vehmov/road_tf_road"
      # Only countries not covered by JRC-IDEES (JRC-IDEES has priority).
      # ISO 3166-1 alpha-3 -> Eurostat geo code. Quote "NO": unquoted it is a YAML boolean.
      country_codes:
        GBR: "UK"
        NOR: "NO"
        MKD: MK
      principle:
        GBR: territorial
        NOR: territorial
        MKD: territorial
      # Vehicle categories taken from this source where not all five (one source
      # per country and category). MKD heavy-duty comes from MAKSTAT.
      vkm_categories:
        MKD: [passenger_car, bus]
    bfs:
      # Swiss Federal Statistical Office (BFS), one Excel table each for freight and
      # passenger road traffic. Pinned DAM asset IDs: a new BFS release gets a new ID.
      url: "https://dam-api.bfs.admin.ch/hub/api/dam/assets/{asset_id}/master"
      tables:
        freight:
          # je-d-11.05.01.01 "Fahrleistungen im Gueterverkehr", Stand Juli 2026.
          bfs_number: je-d-11.05.01.01
          asset_id: 36662225
        passenger:
          # je-d-11.04.01.01 "Fahrleistungen und Fahrzeugbewegungen im
          # Personenverkehr", Stand Oktober 2026.
          bfs_number: je-d-11.04.01.01
          asset_id: 36851390
        stock:
          # cc-d-11.03.02.01.03 "Strassenfahrzeugbestand nach Fahrzeuggruppe und
          # Fahrzeugart" (BFS/ASTRA, stock at 30 September), Stand Oktober 2026.
          bfs_number: cc-d-11.03.02.01.03
          asset_id: 36852326
        mopeds:
          # je-d-11.03.02.01.04 "Bestand der Motorfahrraeder nach Kanton (inkl.
          # schnelle E-Bikes)", 1970-2025, Stand Mai 2026.
          bfs_number: je-d-11.03.02.01.04
          asset_id: 36613609
      source: "BFS je-d-11.04.01.01/je-d-11.05.01.01"
      stock_source: "BFS cc-d-11.03.02.01.03/je-d-11.03.02.01.04"
      # ISO 3166-1 alpha-3 -> BFS country code (BFS only covers Switzerland).
      country_codes:
        CHE: CH
      principle:
        CHE: territorial
    eurostat_stock:
      # Eurostat road vehicle stock (number of vehicles), full datasets as SDMX-CSV,
      # downloaded with the `eurostat` URL. Not versioned: "LAST UPDATE" is logged.
      datasets: [road_eqs_lorroa, road_eqs_carmot, road_eqs_busveh, road_eqs_mopeds]
      source: "Eurostat road_eqs"
      # Countries whose vehicle stock comes from Eurostat (ISO alpha-3 -> geo code).
      # Quote "NO": unquoted it is a YAML boolean.
      stock_country_codes:
        NOR: "NO"
        ALB: AL
        BIH: BA
        MNE: ME
        SRB: RS
      # Country -> category -> years (or "all") not used because the Eurostat
      # values are unreliable; left missing and logged.
      exclude:
        # Lorries > 3.5 t = all goods vehicles in 2014-2015; 2023 implausible
        # (8,474 against ~2,800); light goods vehicles 2014-2015 nearly empty.
        MNE:
          heavy_duty: [2014, 2015, 2023]
          light_duty: [2014, 2015]
        # Goods vehicles <= 3.5 t exclude ~50k mixed transport vehicles (INSTAT
        # ATP); motorcycles/mopeds split erratic from 2020.
        ALB:
          light_duty: all
          motorcycle: all
    dft:
      # Department for Transport (DfT) table VEH0101 "Vehicles at the end of the
      # quarter by licence status and body type" (OpenDocument spreadsheet), last
      # updated 23 September 2026 (data to 2026 Q2). Original URL:
      # https://assets.publishing.service.gov.uk/media/6aad561a2f29b38884818708/veh0101.ods
      # DfT media URLs redirect to the newest release, so the file is pinned through
      # a UK Government Web Archive capture (byte-identical to the original).
      url: "https://webarchive.nationalarchives.gov.uk/ukgwa/20261102165501id_/https://assets.publishing.service.gov.uk/media/6aad561a2f29b38884818708/veh0101.ods"
      source: "DfT VEH0101"
      # Countries whose vehicle stock comes from DfT (ISO alpha-3 -> DfT code;
      # GB = Great Britain, without Northern Ireland).
      stock_country_codes:
        GBR: GB
    makstat:
      # State Statistical Office of North Macedonia (MAKSTAT), PX-Web API. The full
      # table is requested as CSV (POST, no filter). Not versioned: the table's
      # "updated" date from the folder listing is logged.
      url: "https://makstat.stat.gov.mk/PXWeb/api/v1/en/MakStat/Transport/{folder}/{table_id}"
      tables:
        freight:
          # "Passenger and freight transport, by years": freight vehicle-km of
          # domestic goods vehicles >= 3.5 t load capacity (road freight survey).
          folder: PatenTransport
          table_id: 560_Trans_MK_T39_ml.px
        stock:
          # "Registered road motor vehicles and trailers by years, by
          # municipalities, number" (stock at 31 December).
          folder: RegistriraniVozila
          table_id: 150_Trans_regi_veh_by_type_mun_ml.px
      source: "MAKSTAT 560_Trans_MK_T39"
      stock_source: "MAKSTAT 150_Trans_regi_veh_by_type_mun"
      # ISO 3166-1 alpha-3 -> MAKSTAT row label of the national total.
      country_codes:
        MKD: REPUBLIC OF MACEDONIA
      # Domestic vehicles only, in and outside the country.
      principle:
        MKD: nationality
      vkm_categories:
        MKD: [heavy_duty]
    hagstofa:
      # Statistics Iceland, PX-Web API. Not versioned: "updated" is logged.
      url: "https://px.hagstofa.is/pxen/api/v1/en/{folder}/{table_id}"
      tables:
        stock:
          # SAM03105 "Registered motor vehicles" (31 December, vehicles in use).
          folder: Umhverfi/5_samgongur/3_okutaekiogvegir/1_okutaeki
          table_id: SAM03105.px
      source: "Statistics Iceland SAM03105"
      stock_country_codes:
        ISL: IS
    ask:
      # Kosovo Agency of Statistics (ASK), PX-Web API. Not versioned: "updated" is
      # logged.
      url: "https://askdata.rks-gov.net/api/v1/en/ASKdata/{folder}/{table_id}"
      tables:
        stock:
          # tr05 "Registered motor and non motor vehicles".
          folder: Transport/Annual%20indicators
          table_id: tr05.px
      source: "ASK tr05"
      stock_country_codes:
        XKX: XK
      # Goods vehicle rows >= 3.5 t and < 3.5 t are swapped in 2018-2019 (also in
      # the ASK 2023 publication); not corrected, left missing.
      exclude:
        XKX:
          heavy_duty: [2018, 2019]
          light_duty: [2018, 2019]
    # Countries without a reliable national road vehicle-km source (left missing,
    # filled in the gap-filling step).
    vkm_not_available: [ALB, BIH, MNE, SRB, XKX, ISL]
    # One vehicle stock source per country. Each source lists its countries in
    # `stock_country_codes`, or else in `country_codes` (shared with vehicle-km).
    stock_sources: [jrc_idees, eurostat_stock, bfs, dft, makstat, hagstofa, ask]
