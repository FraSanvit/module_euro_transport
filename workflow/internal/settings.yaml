# Module settings that users cannot modify.
resources:
  automatic:
    jrc_idees:
      # JRC-IDEES 2021, version 1 (2024-05-20). One zip per EU27 country.
      url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/JRC-IDEES/JRC-IDEES-2021_v1/JRC-IDEES-2021_{jrc_code}.zip"
      source: "JRC-IDEES-2021 v1"
      # ISO 3166-1 alpha-3 -> JRC-IDEES country code (Eurostat style, Greece = EL).
      country_codes:
        AUT: AT
        BEL: BE
        BGR: BG
        CYP: CY
        CZE: CZ
        DEU: DE
        DNK: DK
        EST: EE
        ESP: ES
        FIN: FI
        FRA: FR
        GRC: EL
        HRV: HR
        HUN: HU
        IRL: IE
        ITA: IT
        LTU: LT
        LUX: LU
        LVA: LV
        MLT: MT
        NLD: NL
        POL: PL
        PRT: PT
        ROU: RO
        SWE: SE
        SVN: SI
        SVK: SK
    eurostat:
      # Eurostat dissemination API, full dataset as SDMX-CSV. Not versioned:
      # the "LAST UPDATE" column of each download is logged.
      url: "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/{dataset}/?format=SDMX-CSV&compressed=false"
      datasets: [road_tf_vehmov, road_tf_road]
      source: "Eurostat road_tf_vehmov/road_tf_road"
      # Only countries not covered by JRC-IDEES (JRC-IDEES has priority).
      # ISO 3166-1 alpha-3 -> Eurostat geo code. Quote "NO": unquoted it is a YAML boolean.
      country_codes:
        GBR: "UK"
        NOR: "NO"
        MKD: MK
      principle:
        GBR: territorial
        NOR: territorial
        MKD: territorial
      # Vehicle categories taken from this source where not all five (one source
      # per country and category). MKD heavy-duty comes from MAKSTAT.
      vkm_categories:
        MKD: [passenger_car, bus]
    bfs:
      # Swiss Federal Statistical Office (BFS), one Excel table each for freight and
      # passenger road traffic. Pinned DAM asset IDs: a new BFS release gets a new ID.
      url: "https://dam-api.bfs.admin.ch/hub/api/dam/assets/{asset_id}/master"
      tables:
        freight:
          # je-d-11.05.01.01 "Fahrleistungen im Gueterverkehr", Stand Juli 2026.
          bfs_number: je-d-11.05.01.01
          asset_id: 36662225
        passenger:
          # je-d-11.04.01.01 "Fahrleistungen und Fahrzeugbewegungen im
          # Personenverkehr", Stand Oktober 2026.
          bfs_number: je-d-11.04.01.01
          asset_id: 36851390
        stock:
          # cc-d-11.03.02.01.03 "Strassenfahrzeugbestand nach Fahrzeuggruppe und
          # Fahrzeugart" (BFS/ASTRA, stock at 30 September), Stand Oktober 2026.
          bfs_number: cc-d-11.03.02.01.03
          asset_id: 36852326
        mopeds:
          # je-d-11.03.02.01.04 "Bestand der Motorfahrraeder nach Kanton (inkl.
          # schnelle E-Bikes)", 1970-2025, Stand Mai 2026.
          bfs_number: je-d-11.03.02.01.04
          asset_id: 36613609
      source: "BFS je-d-11.04.01.01/je-d-11.05.01.01"
      stock_source: "BFS cc-d-11.03.02.01.03/je-d-11.03.02.01.04"
      # ISO 3166-1 alpha-3 -> BFS country code (BFS only covers Switzerland).
      country_codes:
        CHE: CH
      principle:
        CHE: territorial
    eurostat_stock:
      # Eurostat road vehicle stock (number of vehicles), full datasets as SDMX-CSV,
      # downloaded with the `eurostat` URL. Not versioned: "LAST UPDATE" is logged.
      datasets: [road_eqs_lorroa, road_eqs_carmot, road_eqs_busveh, road_eqs_mopeds]
      source: "Eurostat road_eqs"
      # Countries whose vehicle stock comes from Eurostat (ISO alpha-3 -> geo code).
      # Quote "NO": unquoted it is a YAML boolean.
      stock_country_codes:
        NOR: "NO"
        ALB: AL
        BIH: BA
        MNE: ME
        SRB: RS
      # Country -> category -> years (or "all") not used because the Eurostat
      # values are unreliable; left missing and logged.
      exclude:
        # Lorries > 3.5 t = all goods vehicles in 2014-2015; 2023 implausible
        # (8,474 against ~2,800); light goods vehicles 2014-2015 nearly empty.
        MNE:
          heavy_duty: [2014, 2015, 2023]
          light_duty: [2014, 2015]
        # Goods vehicles <= 3.5 t exclude ~50k mixed transport vehicles (INSTAT
        # ATP); motorcycles/mopeds split erratic from 2020.
        ALB:
          light_duty: all
          motorcycle: all
    dft:
      # Department for Transport (DfT) table VEH0101 "Vehicles at the end of the
      # quarter by licence status and body type" (OpenDocument spreadsheet), last
      # updated 23 September 2026 (data to 2026 Q2). Original URL:
      # https://assets.publishing.service.gov.uk/media/6aad561a2f29b38884818708/veh0101.ods
      # DfT media URLs redirect to the newest release, so the file is pinned through
      # a UK Government Web Archive capture (byte-identical to the original).
      url: "https://webarchive.nationalarchives.gov.uk/ukgwa/20261102165501id_/https://assets.publishing.service.gov.uk/media/6aad561a2f29b38884818708/veh0101.ods"
      source: "DfT VEH0101"
      # Countries whose vehicle stock comes from DfT (ISO alpha-3 -> DfT code;
      # GB = Great Britain, without Northern Ireland).
      stock_country_codes:
        GBR: GB
    makstat:
      # State Statistical Office of North Macedonia (MAKSTAT), PX-Web API. The full
      # table is requested as CSV (POST, no filter). Not versioned: the table's
      # "updated" date from the folder listing is logged.
      url: "https://makstat.stat.gov.mk/PXWeb/api/v1/en/MakStat/Transport/{folder}/{table_id}"
      tables:
        freight:
          # "Passenger and freight transport, by years": freight vehicle-km of
          # domestic goods vehicles >= 3.5 t load capacity (road freight survey).
          folder: PatenTransport
          table_id: 560_Trans_MK_T39_ml.px
        stock:
          # "Registered road motor vehicles and trailers by years, by
          # municipalities, number" (stock at 31 December).
          folder: RegistriraniVozila
          table_id: 150_Trans_regi_veh_by_type_mun_ml.px
      source: "MAKSTAT 560_Trans_MK_T39"
      stock_source: "MAKSTAT 150_Trans_regi_veh_by_type_mun"
      # ISO 3166-1 alpha-3 -> MAKSTAT row label of the national total.
      country_codes:
        MKD: REPUBLIC OF MACEDONIA
      # Domestic vehicles only, in and outside the country.
      principle:
        MKD: nationality
      vkm_categories:
        MKD: [heavy_duty]
    hagstofa:
      # Statistics Iceland, PX-Web API. Not versioned: "updated" is logged.
      url: "https://px.hagstofa.is/pxen/api/v1/en/{folder}/{table_id}"
      tables:
        stock:
          # SAM03105 "Registered motor vehicles" (31 December, vehicles in use).
          folder: Umhverfi/5_samgongur/3_okutaekiogvegir/1_okutaeki
          table_id: SAM03105.px
      source: "Statistics Iceland SAM03105"
      stock_country_codes:
        ISL: IS
    ask:
      # Kosovo Agency of Statistics (ASK), PX-Web API. Not versioned: "updated" is
      # logged.
      url: "https://askdata.rks-gov.net/api/v1/en/ASKdata/{folder}/{table_id}"
      tables:
        stock:
          # tr05 "Registered motor and non motor vehicles".
          folder: Transport/Annual%20indicators
          table_id: tr05.px
      source: "ASK tr05"
      stock_country_codes:
        XKX: XK
      # Goods vehicle rows >= 3.5 t and < 3.5 t are swapped in 2018-2019 (also in
      # the ASK 2023 publication); not corrected, left missing.
      exclude:
        XKX:
          heavy_duty: [2018, 2019]
          light_duty: [2018, 2019]
    # Countries without a reliable national road vehicle-km source (left missing,
    # filled in the gap-filling step).
    vkm_not_available: [ALB, BIH, MNE, SRB, XKX, ISL]
    # One vehicle stock source per country. Each source lists its countries in
    # `stock_country_codes`, or else in `country_codes` (shared with vehicle-km).
    stock_sources: [jrc_idees, eurostat_stock, bfs, dft, makstat, hagstofa, ask]
# Gap filling (step 5), applied to the combined national tables.
gap_filling:
  # Gaps inside a series of at most this many consecutive years are filled by
  # linear interpolation; longer gaps are left missing.
  interpolation_max_years: 3
  # Neighbour countries whose average ratios fill missing values of a country, for
  # all vehicle categories (same map as the heavy-duty method, MULTIYEAR_PLAN.md
  # §6.9). Neighbours are processed even when not configured; they must not need
  # neighbours themselves. XKX is not in the heavy-duty plan: it uses SRB's list,
  # since all its direct neighbours are gap filled themselves. MLT uses CYP, the only
  # similar island country.
  neighbours:
    ALB: [GRC]
    BIH: [HRV]
    MKD: [BGR, GRC]
    MNE: [HRV]
    SRB: [BGR, HRV, HUN, ROU]
    XKX: [BGR, HRV, HUN, ROU]
    ISL: [DNK, FIN, NOR, SWE]
    MLT: [CYP]
# Heavy-duty vehicle-km: multi-year territorial level chain (MULTIYEAR_PLAN.md §6.3-§6.8).
# Levels only; gap filling of countries and of intensive parameters from neighbours is
# done later in the common gap-filling step.
heavy_duty:
  # ISO 3166-1 alpha-3 -> Eurostat / GISCO 2-letter code (Greece EL, United Kingdom UK).
  # Quote "NO": unquoted it is a YAML boolean.
  country_codes:
    ALB: AL
    AUT: AT
    BEL: BE
    BGR: BG
    BIH: BA
    CHE: CH
    CYP: CY
    CZE: CZ
    DEU: DE
    DNK: DK
    ESP: ES
    EST: EE
    FIN: FI
    FRA: FR
    GBR: UK
    GRC: EL
    HRV: HR
    HUN: HU
    IRL: IE
    ISL: IS
    ITA: IT
    LTU: LT
    LUX: LU
    LVA: LV
    MKD: MK
    MLT: MT
    MNE: ME
    NLD: NL
    "NOR": "NO"
    POL: PL
    PRT: PT
    ROU: RO
    SRB: RS
    SVK: SK
    SVN: SI
    SWE: SE
    XKX: XK
  eurostat:
    # Live downloads (SDMX-CSV, not versioned: "LAST UPDATE" is logged).
    url: "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/{query}format=SDMX-CSV&compressed=false"
    # File name -> dataflow and key/time query (ends with "?" or "&").
    queries:
      road_go_ta_tott: "road_go_ta_tott/?"
      road_go_ta_dc: "road_go_ta_dc/?"
      road_go_ca_hac: "road_go_ca_hac/?"
      road_go_ta_tra: "road_go_ta_tra/?"
      # Laden journeys (trip length) for estimating unreported empty km.
      road_go_ta_vm: "road_go_ta_vm/?"
      demo_r_pjanaggr3_uk: "demo_r_pjanaggr3/A.NR.T.TOTAL.UK+UKN/?"
      # GDP in PPS and in euro: proxy for the domestic level of countries without a
      # survey (MULTIYEAR_PLAN.md §6.9).
      nama_10_gdp: "nama_10_gdp/A.CP_MPPS_EU27_2020+CP_MEUR.B1GQ.?"
      # Tonnes loaded / unloaded by NUTS-3 region (all goods): short-haul key (§6.10).
      road_go_na_rl3g: "road_go_na_rl3g/A.TOTAL.THS_T.?"
      road_go_na_ru3g: "road_go_na_ru3g/A.TOTAL.THS_T.?"
    # International tonnes by reporting haulier x loading x unloading country, one file per year.
    road_go_ia_rc: "road_go_ia_rc/?startPeriod={year}&endPeriod={year}&"
  etisplus:
    # Speth et al. (2022), Mendeley Data v1, DOI 10.17632/py2zkrb65h.1 (CC BY 4.0). SHA-256 as
    # published by Mendeley; checked after download.
    url: "https://data.mendeley.com/public-files/datasets/py2zkrb65h/files/{file_id}/file_downloaded"
    files:
      od_flows: {file_id: de94fffc-c08c-4c46-b839-c8011fbd09cb, name: 01_Trucktrafficflow.csv, sha256: 36eb62916764024c21b2626720d0b6610d4d44e570c2f6b6a7b19f8c910ea71a}
      regions: {file_id: 7bcf65b6-6323-43b1-bf5f-e9bd8d052117, name: 02_NUTS-3-Regions.csv, sha256: 448e765c98af789436ad9fc6c9e88f2b7a493d485a07e9832b13b777f770e69a}
      nodes: {file_id: 9e636841-e3f6-4fa3-8d18-68c2c8c12891, name: 03_network-nodes.csv, sha256: bce7afde112d9855b54dc22b66ccdefcea076b50c5ff550567b3a43364a3ed05}
      edges: {file_id: 6060c87d-d7d8-4950-a106-63811f949421, name: 04_network-edges.csv, sha256: fd48e07dd24918fd5d2ca7fd86d657ad4d316b66f9329c22edd299acd18e567a}
    flow_column: Traffic_flow_trucks_2019
    chunk_rows: 100000
    # A manually added link (ferry or connector) with more than this share of its length
    # on sea counts as sea over its whole length.
    ferry_sea_share: 0.5
    # Network km on sea (ferries): `drop` (trucks on a ferry drive no road km and use no
    # fuel; territorial road vkm) or `ports` (half to each end node's country).
    sea_handling: drop
  gisco:
    countries: "https://gisco-services.ec.europa.eu/distribution/v2/countries/geojson/CNTR_RG_10M_2020_4326.geojson"
  # Equal-area projection used for lengths and overlays.
  crs: "EPSG:3035"
  # Spatial allocation (MULTIYEAR_PLAN.md §6.2, §6.10): inputs and grid extent.
  spatial:
    # Country polygons for the grid (1:3 million: ~300 m, enough for 1 km cells).
    countries: "https://gisco-services.ec.europa.eu/distribution/v2/countries/geojson/CNTR_RG_03M_2020_3035.geojson"
    # Polygons are clipped to this box (lon/lat): overseas territories, the Canaries and
    # Madeira fall outside and their share stays with the rest of the country.
    bbox_lonlat: [-25, 33, 45, 72]
    buffer_km: 20
    # Countries GISCO does not separate: their polygon (fixed snapshot) is cut out of the
    # GISCO polygon of `parent`. Kosovo: geoBoundaries gbOpen ADM0 (OpenStreetMap, CC BY-SA
    # 2.0, boundary year 2021); GISCO's RS includes it.
    # Population (GHS-POP R2023A, 1 km, Mollweide), epochs interpolated linearly between
    # them and held outside (§6.2). One zip of about 320 MB per epoch.
    ghs_pop:
      url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E{epoch}_GLOBE_R2023A_54009_1000/V1-0/GHS_POP_E{epoch}_GLOBE_R2023A_54009_1000_V1_0.zip"
      epochs: [2015, 2020, 2025]
    # NUTS-3 polygons (GISCO 1:1 million); the tonnes of each year are matched to the
    # version holding most of their codes.
    nuts3:
      url: "https://gisco-services.ec.europa.eu/distribution/v2/nuts/geojson/NUTS_RG_01M_{version}_3035_LEVL_3.geojson"
      versions: [2013, 2016, 2021, 2024]
    # Non-residential built-up surface (GHS-BUILT-S NRES R2023A, 1 km, Mollweide; m2 per
    # cell): within-region weight of the short-haul key when `short_haul.weight` is
    # non_residential_built. About 34 MB per epoch.
    ghs_built_nres:
      url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_NRES_E{epoch}_GLOBE_R2023A_54009_1000/V1-0/GHS_BUILT_S_NRES_E{epoch}_GLOBE_R2023A_54009_1000_V1_0.zip"
      epochs: [2015, 2020, 2025]
    carved:
      XKX:
        parent: SRB
        url: "https://www.geoboundaries.org/data/snapshots/1c423398df24ddf6e730b116567d2181c9782778d0459c3f3b76ca2f9f12b6bc/gbOpen/XKX/ADM0/geoBoundaries-XKX-ADM0.geojson"
        sha256: 6dcc86a7673137690310e5ae55be91611951876bde5311d23881fa1714594344
  territorial_totals:
    dft:
      # DfT road traffic statistics, GB roads, all HGVs, vehicle-miles (sum over regions).
      url: "https://storage.googleapis.com/dft-statistics/road-traffic/downloads/data-gov-uk/region_traffic_by_vehicle_type.csv"
      source: "DfT region_traffic_by_vehicle_type (GB, all HGVs)"
      miles_to_km: 1.609344
      # GB covers the United Kingdom without Northern Ireland (UKN); scaled with the
      # GB share of UK population in the latest year Eurostat has both.
      covered_part: UKN
    trafa:
      # Trafikanalys t04010: heavy lorries 3.51-16 t, 16.01-26 t, > 26 t, million vkm on
      # Swedish roads (Swedish and foreign vehicles).
      url: "https://api.trafa.se/api/data?lang=sv&query=t04010|fslag:22,23,24|fordonkm|ar:{years}"
      source: "Trafikanalys t04010 (heavy lorries)"
      first_year: 2005
    # CHE: BFS je-d-11.05.01.01 "Schwere Fahrzeuge" via the module's prepare_bfs_road_vkm.
    overrides: {GBR: dft, SWE: trafa, CHE: bfs}
  zenodo:
    # Static inputs without a stable download (MULTIYEAR_PLAN.md §4.1). Only the German
    # motorway toll series is read from it.
    url: "https://zenodo.org/api/records/24509838/files/national_data.zip/content"
    md5: 74cb2bd414351963795cbef24160e3ca
    toll_file: national_data/de_toll_balm/de_toll_bab_by_nationality.csv
    toll_sha256: 2d75ae04474610de0eee8825c266735dd065489252997cb8f86fd93b9e81ee87
  # Countries whose international level of foreign trucks comes from motorway toll km by
  # vehicle nationality (1000 km), where available.
  toll_countries: [DEU]
  # Share of foreign cabotage driven on the toll network (beta).
  toll_cabotage_share: 1.0
  # No cabotage rights (non-EU/EFTA) or island.
  cabotage_zero: [ALB, BIH, MKD, MNE, SRB, XKX, ISL]
  # No land borders: no international traffic.
  islands: [ISL, CYP, MLT]
  # Survey values treated as missing (logged): own hauliers' national (domestic) and
  # international activity.
  exclude:
    MNE:
      # National transport about 2 million vkm/year (16 vkm per capita in 2019, against
      # 90-600 elsewhere).
      domestic: all
      own_international: all
    MKD:
      # National transport 10-13 million vkm/year, against 835 million vkm of national
      # hauliers in MAKSTAT 560_Trans_MK_T39 (2019).
      domestic: all
      own_international: all
  # Coverage correction of the foreign-hauliers index (MULTIYEAR_PLAN.md §6.6): if more
  # than this share of the reference-year index comes from hauliers that no longer
  # report (IRL from 2020: 99% UK hauliers), the index is left missing.
  max_coverage_gap: 0.5
  # road_go_ta_dc changes definition in this year (journeys < 50 km jump ~+40% in almost
  # every country, national vkm flat); alpha_E from this year on is linked to the earlier
  # definition, which matches the 2019 calibration year (§6.7).
  distance_class_break: 2022
  # Unreported empty km (IT, RO; BE, LU in early years): empty/laden ratio = weighted mean
  # over the countries reporting both in that year, Gaussian weights on the difference in
  # log average laden trip length (road_go_ta_vm) with this standard deviation (0.2 ~ +-20%
  # trip length); separately for national and international transport (§6.4).
  empty_km_bandwidth: 0.2
  # Gap filling of the national levels (MULTIYEAR_PLAN.md §6.9): gaps at the start or end
  # of a country's own ratio series follow a Theil-Sen trend over the nearest
  # `trend_years` observed years, clipped to their range; alpha_E values more than
  # `outlier_mad` robust standard deviations and `outlier_min_abs` from the country's
  # median are replaced.
  fill:
    trend_years: 5
    outlier_mad: 4
    outlier_min_abs: 0.2
    # Countries whose domestic ETISplus vkm (E-roads + first and last legs) is below this
    # share of their domestic level in the reference year are not covered by ETISplus (no
    # zones, or only transit and trips to and from the EU: ALB, BIH, MKD, MNE, SRB, XKX);
    # their L_int is at least D x the neighbours' L_int per D (islands excluded).
    etisplus_min_coverage: 0.1
  # Year-on-year change above which a level is flagged.
  jump_flag: 0.25
