$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for user-provided configuration files."
type: object
additionalProperties: false
required: [countries]
properties:
  countries:
    description: >-
      Countries to process, as ISO 3166-1 alpha-3 codes. EU27 countries use
      JRC-IDEES 2021; GBR and NOR use Eurostat; CHE uses the Swiss Federal
      Statistical Office (BFS).
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [AUT, BEL, BGR, CYP, CZE, DEU, DNK, EST, ESP, FIN, FRA, GRC, HRV, HUN,
        IRL, ITA, LTU, LUX, LVA, MLT, NLD, POL, PRT, ROU, SWE, SVN, SVK,
        GBR, NOR, CHE]
