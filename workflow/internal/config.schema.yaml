$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for user-provided configuration files."
type: object
additionalProperties: false
required: [countries]
properties:
  countries:
    description: >-
      Countries to process, as ISO 3166-1 alpha-3 codes. Vehicle-km: EU27 from
      JRC-IDEES 2021, GBR and NOR from Eurostat, CHE from the Swiss Federal
      Statistical Office (BFS), MKD from Eurostat (cars, buses) and the State
      Statistical Office of North Macedonia (MAKSTAT, heavy-duty). Vehicle stock:
      EU27 from JRC-IDEES 2021, NOR from Eurostat, CHE from BFS, GBR from the UK
      Department for Transport (DfT), MKD from MAKSTAT.
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [AUT, BEL, BGR, CYP, CZE, DEU, DNK, EST, ESP, FIN, FRA, GRC, HRV, HUN,
        IRL, ITA, LTU, LUX, LVA, MLT, NLD, POL, PRT, ROU, SWE, SVN, SVK,
        GBR, NOR, CHE, MKD]
